<!DOCTYPE html>
<html>
    <head>
        <script src="initShaders.js"></script>

        <script id="vertex-shader" type="x-shader/x-vertex">
#version 300 es

uniform float N;
uniform float t;

out float radius;

void main() {
    if (gl_VertexID == 0) {
        radius = 0.0;
        gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
        return;
    }

    int pointID = gl_VertexID - 1;
    float angle = 2.0 * 3.141592653589793 * float(pointID) / (N - 2.0);

    angle += t;

    if (pointID % 2 == 0) {
        radius = 1.0;
    } else {
        radius = 0.4;
    }

    vec2 v = radius * vec2(cos(angle), sin(angle));
    gl_Position = vec4(v, 0.0, 1.0);
}
        </script>

        <script id="fragment-shader" type="x-shader/x-fragment">
#version 300 es

precision mediump float;

in float radius;

out vec4 fColor;

void main() {
    const vec4 red = vec4(1.0, 0.0, 0.0, 1.0);
    const vec4 yellow = vec4(1.0, 1.0, 0.0, 1.0);

    fColor = mix(red, yellow, radius);
}
        </script>

        <script>
            window.onload = () => {
                var canvas = document.getElementById("webgl");
                var gl = canvas.getContext("webgl2");

                gl.clearColor(0.1, 0.1, 0.1, 1.0);

                var program = initShaders(gl, "vertex-shader", "fragment-shader");
                var uN = gl.getUniformLocation(program, "N");
                var uTime = gl.getUniformLocation(program, "t");

                const N = 12;
                var t = 0.0;

                var render = () => {
                    t += 0.01;

                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.useProgram(program);

                    gl.uniform1f(uN, N);
                    gl.uniform1f(uTime, t);

                    gl.drawArrays(gl.TRIANGLE_FAN, 0, N);

                    requestAnimationFrame(render);
                };

                render();
            };
        </script>
    </head>

    <body>
        <canvas id="webgl" width="512" height="512"></canvas>
    </body>
</html>
